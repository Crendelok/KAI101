[project]
name = "findex"
dynamic = ["version"]
description = "A full-text search engine built from scratch: streaming corpus, inverted index, BM25, query language."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "findex contributors" }]
keywords = ["search", "inverted-index", "bm25", "full-text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.3",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/findex/__init__.py"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "matplotlib>=3.11.2",
    "py-spy>=0.4.3",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=5",
    "ruff>=0.6",
    "truststore>=0.10.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: takes more than a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "if TYPE_CHECKING:"]
